apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-api-deployment
  labels:
    app: spam-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spam-api
  template:
    metadata:
      labels:
        app: spam-api
    spec:
      containers:
      - name: spam-api
        image: spam-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: spam-api-service
spec:
  type: ClusterIP
  selector:
    app: spam-api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
