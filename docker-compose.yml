services:
  cache:
    image: redis:7-alpine
    container_name: spam_cache
    ports:
      - "6379:6379"
    networks:
      - spam_network

  api:
    image: spam-api:multistage
    container_name: spam_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - CACHE_TTL_SECONDS=300
    depends_on:
      - cache
    networks:
      - spam_network

networks:
  spam_network:
    driver: bridge
