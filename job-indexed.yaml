apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validator-job
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: shard-validator
    spec:
      restartPolicy: Never
      containers:
      - name: validator
        image: shard-validator:v1
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "1"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "128Mi"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
